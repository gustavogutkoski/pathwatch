name: pathwatch

services:
  prometheus:
    image: prom/prometheus:v3.12.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  event-catalog:
    build: ../services/event-catalog
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
  
    booking-service:
      build: ../services/booking-service
      ports:
        - "8082:8080"
      environment:
        CATALOG_BASEURL: http://event-catalog:8080
      depends_on:
        event-catalog:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
        interval: 10s
        timeout: 3s
        retries: 3
        start_period: 30s

volumes:
  prometheus-data:
  grafana-data: