global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: event-catalog
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["event-catalog:8080"]
  - job_name: booking-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["booking-service:8080"]