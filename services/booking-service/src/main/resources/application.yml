spring:
  application:
    name: booking-service

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

booking:
  hold-duration: 2m
  expiration-interval: PT5S

catalog:
  base-url: http://localhost:8081
  timeout: 2s